name: Publish packaging-waste-proxy hot fix

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build-and-publish-hotfix:
    name: Build and publish packaging-waste-proxy hot fix
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore, format, and build
        run: |
          dotnet tool restore
          dotnet restore packaging-waste-proxy.slnx
          dotnet csharpier check .
          dotnet build packaging-waste-proxy.slnx --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test tests/ReverseProxy.Tests/ReverseProxy.Tests.csproj --no-restore
      - name: Start routing test environment
        run: docker compose up --build -d --wait
      - name: Run routing integration tests
        run: dotnet test tests/ReverseProxy.IntegrationTests/ReverseProxy.IntegrationTests.csproj --no-restore
      - name: Show Compose logs
        if: always()
        run: docker compose logs
      - name: Stop routing test environment
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Publish hot fix image
        uses: DEFRA/cdp-build-action/build-hotfix@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  sonarcloud-scan:
    name: SonarCloud scan
    uses: ./.github/workflows/sonarcloud.yml
    needs: build-and-publish-hotfix
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
