name: Run SonarCloud coverage scan

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: SonarCloud coverage scan
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Cache .NET coverage tool
        id: cache-sonar-coverage
        uses: actions/cache@v6
        with:
          path: ./.sonar/coverage
          key: ${{ runner.os }}-sonar-coverage
          restore-keys: ${{ runner.os }}-sonar-coverage
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner
      - name: Install .NET coverage tool
        if: steps.cache-sonar-coverage.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/coverage
          dotnet tool update dotnet-coverage --tool-path ./.sonar/coverage
      - name: Begin SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"DEFRA_packaging-waste-proxy" /o:"defra" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.vscoveragexml.reportsPaths="coverage*.xml"
      - name: Build for analysis
        if: github.actor != 'dependabot[bot]'
        run: dotnet build packaging-waste-proxy.slnx --no-incremental --warnaserror
      - name: Start routing test environment
        if: github.actor != 'dependabot[bot]'
        run: docker compose up --build -d --wait
      - name: Collect test coverage
        if: github.actor != 'dependabot[bot]'
        run: |
          ./.sonar/coverage/dotnet-coverage collect "dotnet test tests/ReverseProxy.Tests/ReverseProxy.Tests.csproj --no-build" -f xml -o coverage.ReverseProxy.Tests.xml
          ./.sonar/coverage/dotnet-coverage collect "dotnet test tests/ReverseProxy.IntegrationTests/ReverseProxy.IntegrationTests.csproj --no-build" -f xml -o coverage.ReverseProxy.IntegrationTests.xml
      - name: End SonarCloud analysis
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      - name: Show Compose logs
        if: always()
        run: docker compose logs
      - name: Stop routing test environment
        if: always()
        run: docker compose down -v --remove-orphans
