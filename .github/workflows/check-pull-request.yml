name: Check packaging-waste-proxy pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  validate:
    name: Validate packaging-waste-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies and tools
        run: |
          dotnet tool restore
          dotnet restore packaging-waste-proxy.slnx
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Build
        run: dotnet build packaging-waste-proxy.slnx --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test tests/ReverseProxy.Tests/ReverseProxy.Tests.csproj --no-restore
      - name: Start routing test environment
        run: docker compose up --build -d --wait
      - name: Run routing integration tests
        run: dotnet test tests/ReverseProxy.IntegrationTests/ReverseProxy.IntegrationTests.csproj --no-restore
      - name: Show Compose logs
        if: always()
        run: docker compose logs
      - name: Stop routing test environment
        if: always()
        run: docker compose down -v --remove-orphans
  sonarcloud-scan:
    name: SonarCloud scan
    uses: ./.github/workflows/sonarcloud.yml
    needs: validate
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
