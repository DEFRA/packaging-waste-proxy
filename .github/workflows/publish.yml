name: Publish packaging-waste-proxy

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.run_number != 1
    name: Build and publish packaging-waste-proxy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore, format, and build
        run: |
          dotnet tool restore
          dotnet restore packaging-waste-proxy.slnx
          dotnet csharpier check .
          dotnet build packaging-waste-proxy.slnx --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test --test-modules tests/ReverseProxy.Tests/bin/Debug/net10.0/ReverseProxy.Tests.dll --no-build
      - name: Start routing test environment
        run: docker compose up --build -d --wait
      - name: Run routing integration tests
        run: dotnet test --test-modules tests/ReverseProxy.IntegrationTests/bin/Debug/net10.0/ReverseProxy.IntegrationTests.dll --no-build
      - name: Show Compose logs
        if: always()
        run: docker compose logs
      - name: Stop routing test environment
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Publish image
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag.
      id-token: write # Authenticate to AWS using OIDC.
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: '094954420758'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish image
        uses: DEFRA/cdp-build-action/build@dfb527d1bca7591fbbfd32ac007557745e888cf2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  sonarcloud-scan:
    name: SonarCloud scan
    uses: ./.github/workflows/sonarcloud.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
